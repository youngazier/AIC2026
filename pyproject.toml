[project]
name = "aic2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "youngazier", email = "cuudendasunkid2208@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "av>=19.0.1",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "torch==2.14.0",
    "transformers>=5.0.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["backend", "data_processing"]

[tool.pytest.ini_options]
markers = ["slow: real-model tests", "gpu: needs CUDA"]
addopts = "-m 'not slow and not gpu'"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
