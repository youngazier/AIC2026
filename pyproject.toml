[project]
name = "aic2026"
version = "0.1.0"
description = "Hệ thống tìm kiếm video AIC 2026 (KIS): pipeline tiền xử lý + backend FastAPI"
readme = "README.md"
# 3.10 chứ không phải 3.13: venv đang chạy thật (venv_embedding) là 3.10.20, và
# torch 2.5.1+cu121 / faiss-gpu-cu12 chưa có wheel cho 3.13.
requires-python = ">=3.10,<3.11"

# Phần lõi: đủ để chạy backend ở chế độ KHÔNG có GPU (SQLite + FTS5 + API).
# Người làm tầng DB/ranking trên máy không có GPU chỉ cần nhóm này.
dependencies = [
    "fastapi==0.137.2",
    "uvicorn==0.49.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "pillow==12.2.0",
    "tqdm==4.68.3",
]

[project.optional-dependencies]
# Nhóm nặng (~7GB): FAISS + text encoder. Bắt buộc trên máy chạy thi đấu thật.
# PIN CHÍNH XÁC VERSION LÀ CỐ Ý: vector trong index được sinh bởi đúng các version
# này. Lệch version có thể làm encode_text() cho vector khác đi một chút — không
# crash, chỉ tụt recall âm thầm. Đừng nới lỏng khi chưa build lại toàn bộ index.
gpu = [
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "faiss-gpu-cu12==1.14.1.post1",
    "open_clip_torch==3.3.0",
    "transformers==5.12.1",
    "timm==1.0.27",
    "ftfy==6.3.1",
    "sentencepiece==0.2.1",
    "pandas==2.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Đường dẫn tương đối trong output cho gọn, và -q mặc định vì bộ test khá dài.
addopts = "-q"
