# Offline processing services. Run from this directory:
#
#   docker compose build                          # CPU image
#   docker compose run --rm phase1 --batch Videos_L21 Videos_L22
#   docker compose run --rm phase2 --batch Videos_L21 --model clip
#   docker compose run --rm phase3 --model clip
#   docker compose run --rm all --batch Videos_L21 --model clip
#
#   # GPU: add compose.gpu.yaml
#   docker compose -f compose.yaml -f compose.gpu.yaml build
#   docker compose -f compose.yaml -f compose.gpu.yaml run --rm phase2 --batch Videos_L21 --device gpu
#
# Arguments after the service name are passed to the CLI, exactly like
# `uv run python -m data_processing.cli <command> ...`.

x-common: &common
  image: aic2026-processing:cpu
  build:
    context: ..
    dockerfile: data_processing/Dockerfile
    args:
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
  # Write output files as your host user instead of root.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  shm_size: "4gb"
  volumes:
    - ../data:/app/data:ro                        # competition inputs, read-only
    - ../data_processed:/app/data_processed       # all generated artifacts (including catalog SQLite DB)
    - ${HF_CACHE_DIR:-~/.cache/huggingface}:/hf-cache  # reuse downloaded CLIP weights

services:
  phase1:
    <<: *common
    entrypoint: ["python", "-m", "data_processing.cli", "phase1"]

  phase2:
    <<: *common
    entrypoint: ["python", "-m", "data_processing.cli", "phase2"]

  phase3:
    <<: *common
    entrypoint: ["python", "-m", "data_processing.cli", "phase3"]

  all:
    <<: *common
    entrypoint: ["python", "-m", "data_processing.cli", "all"]
