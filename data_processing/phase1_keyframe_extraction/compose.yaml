services:
  phase1:
    build:
      context: ../..
      dockerfile: data_processing/phase1_keyframe_extraction/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    image: aic2026-phase1:cpu
    # Defaults match this workspace; override for a different host user.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ../../data:/app/data:ro
      - ../../data_processed:/app/data_processed
    command: ["phase1"]

  phase1-gpu:
    extends: phase1
    profiles: ["gpu"]
    build:
      context: ../..
      dockerfile: data_processing/phase1_keyframe_extraction/Dockerfile
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    image: aic2026-phase1:gpu
    gpus: all
    command: ["phase1", "--device", "gpu"]
